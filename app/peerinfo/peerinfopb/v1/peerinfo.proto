syntax = "proto3";

package app.peerinfo.peerinfopb.v1;

option go_package = "github.com/obolnetwork/charon/app/peerinfo/peerinfopb/v1";

import "google/protobuf/timestamp.proto";

message PeerInfo {
  string                         charon_version = 1;
  bytes                               lock_hash = 2;
  optional google.protobuf.Timestamp    sent_at = 3;
  string                               git_hash = 4;
  optional google.protobuf.Timestamp started_at = 5;
  bool                      builder_api_enabled = 6;
  string                               nickname = 7;
  string                              dv_client = 8;
  // Field 9 carried the builder config hash of v2.0.0 release candidates; the proposer config hash is a
  // different digest and takes a new number so those peers compare as not reporting it.
  reserved 9;
  reserved "builder_config_hash";
  bytes                    proposer_config_hash = 10;

  // NOTE: Always populate timestamps when sending, then make them required after subsequent release.
}
